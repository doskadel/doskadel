# Прод-сборка для сервера (/opt/doskadel). Caddy терминирует HTTPS и проксирует
# doskadel.ru -> frontend:3000, api.doskadel.ru -> backend:5000.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      garage:
        condition: service_healthy
    networks:
      - worklist-network
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - worklist-network
    ports:
      - "3000:3000"

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_SECRET_KEY}
      - GARAGE_DEFAULT_BUCKET=${S3_BUCKET:-doskadel-files}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - worklist-network
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    networks:
      - worklist-network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  worklist-network:
    driver: bridge

volumes:
  mongo_data:
  garage_meta:
  garage_data:
