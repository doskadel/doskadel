<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Тема до рендера (без мигания). По умолчанию светлая,
      // тёмная — только если пользователь явно выбрал.
      (function () {
        try {
          var t = localStorage.getItem('doskadel_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = (t === 'dark' ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0969da" />
    <meta
      name="description"
      content="DoskaDel - Доска дел: задачи, планы, база знаний"
    />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DoskaDel" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>DoskaDel</title>
  </head>
  <body>
    <noscript>Вам нужно включить JavaScript, чтобы запустить это приложение.</noscript>
    <div id="root"></div>
  </body>
</html>
